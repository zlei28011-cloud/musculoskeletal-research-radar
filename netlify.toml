[build]
  publish = "dist"
  command = "python -m radar run --skip-email"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/data.json"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"
